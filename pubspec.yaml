name: chat
description: "Chaty private, customizable messaging."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  get_it: ^9.2.1
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  firebase_core: ^2.24.2
  firebase_auth: ^4.12.0
  cloud_firestore: ^4.15.5
  firebase_storage: ^11.6.0
  supabase_flutter: ^2.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/app_icon.png
