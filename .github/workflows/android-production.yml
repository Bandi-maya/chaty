name: Chaty Android Production

on:
  push:
    branches:
      - production-supabase
      - feat/settings-ui-system-overhaul
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaty-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: >-
          flutter build apk --release --no-pub
          --dart-define=SUPABASE_URL=https://dntnxeanubswyswahdnj.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_gFpVYJctaDkRRgttvnUl-A_TKu81hFF
          --dart-define=TURN_URL="$TURN_URL"
          --dart-define=TURN_USERNAME="$TURN_USERNAME"
          --dart-define=TURN_CREDENTIAL="$TURN_CREDENTIAL"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          cp "$APK" Chaty-production.apk
          unzip -t Chaty-production.apk >/dev/null
          sha256sum Chaty-production.apk | tee Chaty-production.apk.sha256
          ls -lh Chaty-production.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chaty-Production-APK
          path: |
            Chaty-production.apk
            Chaty-production.apk.sha256
          if-no-files-found: error
          retention-days: 14
